<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sales Track</title>
<meta name="theme-color" content="#1f6f4a">
<meta name="application-name" content="Sales Track">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="A simple point-of-sale, stock and customer ledger application.">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1d1d1b;--mute:#6b6a64;--line:#e3e0d6;--acc:#1f6f4a;--accink:#fff;--bad:#b3412e;--chg:#1f6f4a;--cr:#b3412e;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#161614;--card:#222220;--ink:#f1efe8;--mute:#a09e94;--line:#383733;--acc:#4fb582;--accink:#0d1f16;--bad:#e08572;--chg:#4fb582;--cr:#e08572;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid color-mix(in srgb,var(--acc) 35%,transparent);outline-offset:2px}
button:disabled{opacity:.55;cursor:not-allowed}
@media(max-width:420px){main{padding:10px}nav button{padding:9px 10px}.card{padding:12px}.tot b,.sc b{font-size:18px}}
main{max-width:640px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}
.header-left{display:flex;align-items:center;gap:10px}
h1{font-size:20px;margin:0}
.icon-btn{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;color:var(--ink);font-size:16px}
.role{font-size:12px;padding:5px 12px;border-radius:99px;background:var(--acc);color:var(--accink);border:0;cursor:pointer}
nav{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}
nav button{flex:1 0 auto;padding:10px 12px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font-size:13px}
