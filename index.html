function drop(c,id, auditAction, auditDesc){
  delete S[c][id];
  S.del[c+"/"+id]=Date.now();
  mark("d:"+c+"/"+id);
  save();
  push();
  if(auditAction) logAudit(auditAction, auditDesc);
}

function stockOf(id){var n=0;arr("stockin").forEach(function(s){if(s.item===id)n+=s.qty});
  arr("sales").forEach(function(s){(s.lines||[]).forEach(function(l){if(l.item===id)n-=l.qty})});return Math.round(n*1000)/1000}
function lq(l){return l.unit==="kg"?l.qty+" kg "+l.name:l.qty+" × "+l.name}
function um(i){return i.unit==="kg"?"/kg":""}
function su(i){return i.unit==="kg"?" kg":""}
function balances(){var m={};sarr("tx").forEach(function(t){var k=key(t.cust),c=m[k]||(m[k]={name:String(t.cust).trim(),chg:0,cr:0});
  if(t.type==="change")c.chg+=t.amt;else if(t.type==="buy_change")c.chg-=t.amt;else if(t.type==="credit")c.cr+=t.amt;else if(t.type==="pay")c.cr-=t.amt});return m}
function cartTotal(){var t=0;sarr("items").forEach(function(i){t+=(cart[i.id]||0)*i.price});return t}
var LABEL={change:"Change left",credit:"Credit taken",buy_change:"Bought with change",pay:"Part payment"};
function when(ts){return new Date(ts).toLocaleString()}

var cloudUser=null, cloudMember=null;
function checkAuthShell(){
  if(!cloudUser || !cloudMember){$("auth-card").classList.remove("hide");$("app").classList.add("hide");return;}
  $("auth-card").classList.add("hide");$("app").classList.remove("hide");render();
}
$("createBiz").onclick=async function(){
  var email=$("authu").value.trim().toLowerCase(),pass=$("authp").value,name=$("authn").value.trim();
  if(!email||!pass||!name)return say("authmsg","Enter your email, password and full name.",true);
  if(pass.length<8)return say("authmsg","Use a password with at least 8 characters.",true);
  try{await ensureFirebase();var cred=await firebase.auth().createUserWithEmailAndPassword(email,pass);var db=firebase.firestore();var team="st_"+rid().replace(/[^a-z0-9]/gi,"").toLowerCase();var batch=db.batch();batch.set(db.collection("teams").doc(team),{name:"Sales Track Business",ownerUid:cred.user.uid,createdAt:firebase.firestore.FieldValue.serverTimestamp(),schema:1});batch.set(db.collection("teams").doc(team).collection("members").doc(cred.user.uid),{uid:cred.user.uid,email:email,name:name,role:"Administrator",active:true,createdAt:firebase.firestore.FieldValue.serverTimestamp()});await batch.commit();$("teamid").value=team;S.seeded=false;await saveOffline(email,pass,team,{name:name,role:"Administrator"},cred.user.uid);setCloudIdentity(cred.user,{name:name,role:"Administrator"},team);say("authmsg","Business workspace created. Save your workspace ID and keep it private.");alert("Your Sales Track workspace ID is: "+team+". Share it only with authorised staff.");}
  catch(e){say("authmsg",e.message||"Could not create workspace.",true)}
};

  var sq=key($("sq").value),sl=items.filter(function(i){return !sq||key(i.name).indexOf(sq)>-1}).sort(function(a,b){return a.name.localeCompare(b.name)});
  
  if(!(a>0))return say("xmsg","Enter amount above zero.",true);
  var id=rid();
  put("exp",id,{title:t,category:$("xc").value,amount:Math.round(a*100)/100,by:S.me,ts:Date.now()},"Expense Recorded",t+" - "+money(a));
  $("xt").value="";$("xa").value="";say("xmsg","Expense saved.");render()};

$("slist").onclick=function(e){var d=e.target.dataset,items=sarr("items");
  if(d.p){var i=items.filter(function(x){return x.id===d.p})[0];if(!i)return;
    if((cart[d.p]||0)>=stockOf(d.p))return say("smsg","Only "+stockOf(d.p)+" left.",true);cart[d.p]=(cart[d.p]||0)+1;say("smsg","")}
  else if(d.m){cart[d.m]=Math.max(0,(cart[d.m]||0)-1)}else return;render()};

$("slist").onchange=function(e){var id=e.target.dataset.w||e.target.dataset.a;if(!id)return;var v=parseFloat(e.target.value),st=stockOf(id),it0=S.items[id];
  if(e.target.dataset.a){v=(it0&&it0.price>0&&v>0)?v/it0.price:0}
  if(!(v>0)){delete cart[id];say("smsg","")}
  else if(v>st+0.0005){cart[id]=st;say("smsg","Only "+st+" kg left.",true)}
  else{cart[id]=Math.round(v*1000)/1000;say("smsg","")}
  render()};

  var lp=P[n-1],txt="$"+fmtK(vals[n-1]),bw=txt.length*6+12,ty=lp[1]<34?lp[1]+22:lp[1]-10;

function donut(parts){
  var tot=0;parts.forEach(function(p){tot+=p.v});
  var C=2*Math.PI*40,off=0,cs="";
  parts.forEach(function(p){if(p.v<=0)return;var len=p.v/tot*C;cs+='<circle cx="55" cy="55" r="40" fill="none" stroke="'+p.c+'" stroke-width="16" stroke-dasharray="'+len.toFixed(2)+' '+(C-len).toFixed(2)+'" stroke-dashoffset="'+(-off).toFixed(2)+'" transform="rotate(-90 55 55)"/>';off+=len});
  return '<svg viewBox="0 0 110 110" style="width:118px;height:118px;flex:none"><circle cx="55" cy="55" r="40" fill="none" stroke="#17233b" stroke-width="16"/>'+cs+'</svg>'}
function gauge(pct){
  pct=Math.max(0,Math.min(100,pct));var a=Math.PI*(1-pct/100),x=60+38*Math.cos(a),y=62-38*Math.sin(a);
  return '<svg viewBox="0 0 120 72" style="width:100%;max-width:130px;display:block;margin:2px auto 0"><defs><linearGradient id="gg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ef4444"/><stop offset=".5" stop-color="#f59e0b"/><stop offset="1" stop-color="#22c55e"/></linearGradient></defs><path d="M10 62 A50 50 0 0 1 110 62" fill="none" stroke="url(#gg)" stroke-width="10" stroke-linecap="round"/><line x1="60" y1="62" x2="'+x.toFixed(1)+'" y2="'+y.toFixed(1)+'" stroke="#e8eefc" stroke-width="3" stroke-linecap="round"/><circle cx="60" cy="62" r="4" fill="#e8eefc"/></svg>'}
function pn(cls,title,body,right){return '<div class="card '+cls+'"><div class="ph"><b>'+title+'</b>'+(right||'')+'</div>'+body+'</div>'}

function salesAgg(sales,a,b){var o={t:0,n:0,g:0,by:{},pay:{cash:0,credit:0,change:0},items:{},shop:{}};
  sales.forEach(function(x){if(x.ts>=a&&x.ts<b){o.t+=x.total;o.n++;o.g+=x.total-(x.cogs||0);var u=x.by||"Unknown";o.by[u]=(o.by[u]||0)+x.total;o.pay[x.pay]=(o.pay[x.pay]||0)+x.total;var sh=x.shop||"main";o.shop[sh]=(o.shop[sh]||0)+x.total;
    (x.lines||[]).forEach(function(l){var it=o.items[l.item]||(o.items[l.item]={name:l.name,unit:l.unit,q:0,r:0});it.q+=l.qty;it.r+=l.qty*l.price})}});return o}

    (owe.length?'<div class="sub" style="margin-top:8px">Who owes most</div>'+owe.map(function(c){return '<div class="row"><span>'+esc(c.name)+'</span><b class="cr">'+money(c.cr)+'</b></div>'}).join(""):''));

    if(t.ts>=d0&&t.ts<d1){if(t.type==="credit")cg+=t.amt;else if(t.type==="pay")pr+=t.amt;else if(t.type==="change")cl+=t.amt}
    var k=key(t.cust),c=bm[k]||(bm[k]={chg:0,cr:0});if(t.type==="change")c.chg+=t.amt;else if(t.type==="buy_change")c.chg-=t.amt;else if(t.type==="credit")c.cr+=t.amt;else if(t.type==="pay")c.cr-=t.amt});
  var tOwe=0,tHold=0;Object.keys(bm).forEach(function(k){if(bm[k].cr>0.004)tOwe+=bm[k].cr;if(bm[k].chg>0.004)tHold+=bm[k].chg});
  o.push(ln);o.push("CUSTOMERS");
  o.push(padLR("Credit given",money(cg),w));o.push(padLR("Payments received",money(pr),w));o.push(padLR("Change left with us",money(cl),w));
  o.push(padLR("Total owed to us",money(tOwe),w));o.push(padLR("Change we hold",money(tHold),w));
  // targets
  var tg=getTargets();
  if(tg.day>0||tg.month>0){o.push(ln);o.push("TARGETS");
    if(tg.day>0){o.push(padLR("Day target",money(tg.day),w));o.push(padLR("Achieved",Math.round(A.t/tg.day*100)+"%",w))}
    if(tg.month>0){o.push(padLR("Month target",money(tg.month),w));o.push(padLR("Month so far",money(M.t)+" ("+Math.round(M.t/tg.month*100)+"%)",w))}}
  o.push(ln);o.push("Prepared by: "+(S.me||""));
  return ascii(o.join("\n"));
}
function showReport(){
  var p=$("repdate").value.split("-");if(p.length<3)return;
  var d0=new Date(+p[0],+p[1]-1,+p[2]).getTime();
  $("reptxt").textContent=reportText(d0);$("repmsg").textContent="";
}
$("repBtn").onclick=function(){$("repdate").value=ymd(Date.now());showReport();$("repov").classList.remove("hide")};
$("repdate").onchange=showReport;
$("repclose").onclick=function(){$("repov").classList.add("hide")};
$("repprint").onclick=function(){printRaw($("reptxt").textContent)};
$("repshare").onclick=function(){var t=$("reptxt").textContent;if(navigator.share)navigator.share({text:t}).catch(function(){});else if(navigator.clipboard){navigator.clipboard.writeText(t);$("repmsg").textContent="Report copied."}};

  if(viewAll)return say("clrMsg","Pick one shop in the top menu first (not All shops).",true);
  var cols=["items","stockin","sales","tx","exp"];if($("clrAudit").checked)cols.push("audit");
  var total=0;cols.forEach(function(c){total+=sarr(c).length});
  if(!total)return say("clrMsg","This shop has no data to clear.");
  var t=prompt("This will permanently delete "+total+" records from \""+shopName(curShop())+"\" on all devices.\nType DELETE to confirm.");
  if(t!=="DELETE")return say("clrMsg","Cancelled. Nothing was deleted.");
  cols.forEach(function(c){sarr(c).forEach(function(r){delete S[c][r.id];S.del[c+"/"+r.id]=Date.now();mark("d:"+c+"/"+r.id)})});
  cart={};save();push();
  logAudit("Test Data Cleared",total+" records removed from "+shopName(curShop()));
  say("clrMsg","Cleared "+total+" records.");render();
};

/* ---- multiple shops ---- */
var shopUnsub=null,myShops=[];
function myShopIds(){
  if(S.role==="Administrator")return shopList.map(function(x){return x.id});
  var m=cloudMember&&cloudMember.shops;return (m&&m.length)?m:["main"];
}
function renderShops(){
  var sel=$("shopSel"),admin=S.role==="Administrator";
  var ids=myShopIds(),opts=shopList.filter(function(x){return ids.indexOf(x.id)>-1});
  if(!opts.length)opts=[{id:"main",name:"Main shop"}];
  if(!opts.some(function(x){return x.id===S.shop}))S.shop=opts[0].id;
  var html=opts.map(function(x){return '<option value="'+esc(x.id)+'">'+esc(x.name)+'</option>'}).join("");
  if(admin&&opts.length>1)html+='<option value="__all">All shops</option>';
  if(sel){sel.innerHTML=html;sel.value=(admin&&viewAll)?"__all":S.shop;sel.classList.toggle("hide",!(admin||opts.length>1));}
  if(used)return say("shopMsg","This shop still has "+used+" records. Switch to it and use Clear test data first.",true);
  var staff=teamList.filter(function(m){return m.active!==false&&(m.shops||[]).indexOf(id)>-1});
  if(staff.length)return say("shopMsg","Disable "+staff.map(function(m){return m.name}).join(", ")+" in Team Members first.",true);
  if(!confirm("Remove shop \""+shopName(id)+"\"?"))return;
  try{await firebase.firestore().collection("teams").doc(S.live.t).collection("shops").doc(id).delete();if(S.shop===id){S.shop="main";save()}say("shopMsg","Shop removed.")}catch(x){say("shopMsg",friendlyAuthError(x),true)}};
$("shopAdd").onclick=async function(){
  var name=$("shopname").value.trim();
  if(S.role!=="Administrator"||!S.live)return say("shopMsg","Only administrators can add shops.",true);
  if(!name)return say("shopMsg","Enter a shop name.",true);
  var id="s"+Date.now().toString(36);
  try{await firebase.firestore().collection("teams").doc(S.live.t).collection("shops").doc(id).set({name:name,createdAt:firebase.firestore.FieldValue.serverTimestamp()});
    $("shopname").value="";say("shopMsg",name+" added.");
  }catch(e){say("shopMsg",friendlyAuthError(e),true)}
};

/* ---- team management (cloud) ---- */
var teamList=[],teamUnsub=null;
function renderTeam(){
  var el=$("ulist");if(!el)return;
  if(!cloudUser){el.innerHTML='<div class="sub">Sign in to see your team.</div>';return;}
  if(!teamList.length){el.innerHTML='<div class="sub">No team members loaded yet.</div>';return;}
  var admin=S.role==="Administrator";
  el.innerHTML=teamList.map(function(m){
    var me=m.uid===cloudUser.uid,on=m.active!==false;
    return '<div class="row"><div><b>'+esc(m.name||"")+'</b>'+(me?' <span class="sub">(you)</span>':'')+'<div class="sub">'+esc(m.email||"")+'</div><div class="sub">'+esc(m.role||"Employee")+(m.role==="Administrator"?' · all shops':' · '+esc(shopName((m.shops&&m.shops[0])||"main")))+' · '+(on?'Active':'<span class="low">Disabled</span>')+'</div></div>'+
    (admin&&!me?'<div style="text-align:right"><button class="del" data-tog="'+esc(m.uid)+'">'+(on?'Disable':'Enable')+'</button> <button class="del" data-role="'+esc(m.uid)+'">Make '+(m.role==="Administrator"?'Employee':'Admin')+'</button></div>':'')+'</div>'}).join("");
  return ensureFirebase().then(function(){authWatching=true;firebase.auth().onAuthStateChanged(async function(user){
    if(!user){if(cloudUser&&cloudUser.offline)lvStatus("Back online, but this phone is not signed in to the cloud. Log out and sign in again to upload your sales.");return}
    await resumeCloud(user);
  })}).catch(function(e){lvStatus(e.message)});
}
startAuthWatch();
window.addEventListener("online",function(){
  if(!(cloudUser&&cloudUser.offline))return;
  lvStatus("Back online. Connecting…");
  startAuthWatch().then(function(){var u=window.firebase&&firebase.auth&&firebase.auth().currentUser;
    if(u)resumeCloud(u);else if(authWatching)lvStatus("Back online, but this phone is not signed in to the cloud. Log out and sign in again to upload your sales.")});
});
})();
